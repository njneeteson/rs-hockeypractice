# cargo-deny: checks every dependency (run by CI; locally `cargo deny check`).
#
# * advisories: no crate with a known security advisory, and no unmaintained
#   or yanked ones.
# * licenses: only the permissive licences listed below.
# * bans: warn about the same crate in several versions.
# * sources: crates only from crates.io, never from git or other registries.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # ttf-parser is unmaintained. It reads fonts for the PDF stack (usvg,
    # fontdb, krilla, rustybuzz) and for text widths in pdf.rs, only ever
    # parsing the two Noto Sans files compiled into the binary, never a
    # font from a user. Revisit when usvg/krilla move to `skrifa`.
    { id = "RUSTSEC-2026-0192", reason = "only parses our own embedded fonts; no maintained drop-in for usvg/krilla yet" },
]

[licenses]
version = 2
# Only what the dependencies use today; a new licence fails CI until it's
# reviewed and added here.
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside this workspace have no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
