# Weekly pull requests for dependency updates. Each one runs CI (including
# `cargo deny`), so a broken or vulnerable update shows up before it's merged.
# GitHub Actions are pinned to commit SHAs; Dependabot updates the SHA and
# its version comment together.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all patch and minor updates; majors come one by one.
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # usvg must be the version krilla-svg uses (its types cross between them),
      # so it moves only when krilla-svg does: bump both by hand then.
      - dependency-name: usvg

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
